apiVersion: batch/v1
kind: CronJob
metadata:
  name: checkout-test
  namespace: default
spec:
  schedule: "*/2 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: checkout-test
            image: curlimages/curl:latest
            command: ["/bin/sh", "/scripts/checkout-test.sh"]
            volumeMounts:
            - name: script-volume
              mountPath: /scripts
          volumes:
          - name: script-volume
            configMap:
              name: checkout-test-script
              defaultMode: 0777
          restartPolicy: Never